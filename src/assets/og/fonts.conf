<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Directory where your custom TTF/OTF files are located -->
  <dir prefix="cwd">src/assets/og/fonts</dir>

  <!-- Directory for fontconfig to store its cache -->
  <cachedir>/tmp/fonts-cache/</cachedir>

  <!-- Font family aliases for OG image generation -->
  <!-- Map the font-family names used in SVG to actual font families -->
  <alias>
    <family>SchoolBookNew-Bold</family>
    <prefer>
      <family>SchoolBook New</family>
    </prefer>
  </alias>

  <alias>
    <family>PTSerifProWeb-Book</family>
    <prefer>
      <family>PT Serif Pro Web</family>
    </prefer>
  </alias>

  <!-- Ensure bold weight is used for SchoolBook New -->
  <match>
    <test name="family">
      <string>SchoolBook New</string>
    </test>
    <test name="weight" compare="more_eq">
      <int>200</int>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>SchoolBook New</string>
    </edit>
  </match>

  <config></config>
</fontconfig>
